services:
  talent-campus:
    image: talent-campus:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
    ports:
      - "${TALENT_CAMPUS_BIND_ADDRESS:-127.0.0.1}:${TALENT_CAMPUS_PORT:-8081}:8080"
    volumes:
      - talent-data:/app/App_Data
      - talent-keys:/home/app/.aspnet/DataProtection-Keys

volumes:
  talent-data:
  talent-keys:
